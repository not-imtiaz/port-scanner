<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Scanner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">TCP SYN Scanner Dashboard</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-6 flex gap-4 items-end">
            <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Target IP</label>
                <input type="text" id="targetIp" value="127.0.0.1"
                    class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Port Range</label>
                <input type="text" id="portRange" value="1-1024"
                    class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <button id="scanBtn" onclick="runScan()"
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition font-medium">
                Run Scan
            </button>
        </div>

        <div id="loading" class="hidden text-center py-4 text-blue-600 font-medium">Scanning in progress... Please wait.
        </div>

        <div id="resultsArea" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">Open Ports (<span id="openCount">0</span>)</h2>
                <div class="overflow-y-auto max-h-64">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm">
                                <th class="p-2 border-b">Port</th>
                                <th class="p-2 border-b">Inferred Service</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md flex flex-col items-center justify-center">
                <h2 class="text-xl font-semibold mb-4 w-full border-b pb-2">Scan Breakdown</h2>
                <div class="w-64 h-64">
                    <canvas id="scanChart"></canvas>
                </div>
                <p class="mt-4 text-gray-600 text-sm">Total Scanned: <span id="totalScanned" class="font-bold">0</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        async function runScan() {
            const btn = document.getElementById('scanBtn');
            const loading = document.getElementById('loading');
            const resultsArea = document.getElementById('resultsArea');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            resultsArea.classList.add('hidden');

            const payload = {
                target_ip: document.getElementById('targetIp').value,
                port_range: document.getElementById('portRange').value,
                threads: 50
            };

            try {
                // Ensure this matches the port uvicorn runs on
                const response = await fetch('http://localhost:8000/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                renderResults(data);
            } catch (error) {
                alert("Error connecting to backend. Is the API running?");
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }

        function renderResults(data) {
            document.getElementById('resultsArea').classList.remove('hidden');

            // Render Table
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = '';
            document.getElementById('openCount').innerText = data.open_ports.length;
            document.getElementById('totalScanned').innerText = data.total_scanned;

            if (data.open_ports.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="p-2 text-center text-gray-500">No open ports found.</td></tr>';
            } else {
                data.open_ports.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-2 font-mono text-blue-600">${item.port}</td>
                            <td class="p-2 text-gray-700">${item.service}</td>
                        </tr>
                    `;
                });
            }

            // Render Chart
            const ctx = document.getElementById('scanChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Open', 'Closed/Filtered'],
                    datasets: [{
                        data: [data.open_ports.length, data.closed_filtered],
                        backgroundColor: ['#22c55e', '#cbd5e1'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYN Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --bg: #F5F5F7;
            --surface: #FFFFFF;
            --border: #D2D2D7;
            --text-pri: #1D1D1F;
            --text-sec: #6E6E73;
            --accent: #1D1D1F;
            --accent-fg: #FFFFFF;
            --ring: rgba(0, 0, 0, .12);
        }

        html.dark {
            --bg: #000000;
            --surface: #111111;
            --border: #2C2C2E;
            --text-pri: #F5F5F7;
            --text-sec: #8E8E93;
            --accent: #F5F5F7;
            --accent-fg: #000000;
            --ring: rgba(255, 255, 255, .10);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-pri);
            min-height: 100vh;
            transition: background .25s, color .25s;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 99px;
        }

        /* ── Layout ── */
        .page {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* ── Header ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0 0;
        }

        .wordmark {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: .04em;
            color: var(--text-sec);
            text-transform: uppercase;
            user-select: none;
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .2s, background .2s;
            color: var(--text-pri);
        }

        .theme-btn:hover {
            border-color: var(--text-sec);
        }

        /* ── Hero headline ── */
        .hero {
            padding: 56px 0 40px;
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 600;
            letter-spacing: -.02em;
            line-height: 1.15;
            color: var(--text-pri);
        }

        .hero p {
            margin-top: 10px;
            font-size: 15px;
            color: var(--text-sec);
            font-weight: 400;
            line-height: 1.6;
        }

        /* ── Controls ── */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        @media (max-width: 560px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-sec);
        }

        .field input {
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text-pri);
            font-family: inherit;
            font-size: 14px;
            padding: 0 14px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .field input:focus {
            border-color: var(--text-sec);
            box-shadow: 0 0 0 3px var(--ring);
        }

        .field input::placeholder {
            color: var(--border);
        }

        .scan-btn {
            height: 44px;
            padding: 0 24px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: var(--accent-fg);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: opacity .15s, transform .1s;
            letter-spacing: -.01em;
        }

        .scan-btn:hover:not(:disabled) {
            opacity: .85;
        }

        .scan-btn:active:not(:disabled) {
            transform: scale(.97);
        }

        .scan-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* spinner */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--accent-fg);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }

        .scan-btn.loading .spinner {
            display: block;
        }

        .scan-btn.loading .btn-label {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 40px 0;
            opacity: .6;
        }

        /* ── Results header ── */
        .results-meta {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .results-meta h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -.015em;
        }

        .meta-badge {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sec);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 3px 11px;
            letter-spacing: .02em;
        }

        /* ── Layout: table + chart side by side ── */
        .results-layout {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 620px) {
            .results-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ── Table ── */
        .table-wrap {
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .port-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        .port-table thead {
            background: var(--bg);
        }

        .port-table thead th {
            padding: 11px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-sec);
            border-bottom: 1px solid var(--border);
        }

        .port-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background .1s;
        }

        .port-table tbody tr:last-child {
            border-bottom: none;
        }

        .port-table tbody tr:hover {
            background: var(--bg);
        }

        .port-table td {
            padding: 13px 16px;
            color: var(--text-pri);
        }

        .port-num {
            font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-pri);
        }

        .service-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--text-sec);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px 8px;
        }

        .open-dot {
            width: 6px;
            height: 6px;
            background: #34C759;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 0 2px rgba(52, 199, 89, .2);
        }

        /* ── Empty state ── */
        .empty-state {
            padding: 52px 24px;
            text-align: center;
        }

        .empty-state .empty-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 14px;
            opacity: .2;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-sec);
        }

        /* ── Chart panel ── */
        .chart-panel {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px 20px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .chart-title {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-sec);
            align-self: flex-start;
        }

        .donut-wrap {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .donut-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .donut-big {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -.03em;
            color: var(--text-pri);
        }

        .donut-sub {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-sec);
            margin-top: 1px;
        }

        /* chart legend */
        .chart-legend {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .legend-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-sec);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-val {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-pri);
            font-variant-numeric: tabular-nums;
        }

        /* ── Error ── */
        .error-bar {
            border: 1px solid #FF3B30;
            background: rgba(255, 59, 48, .06);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #FF3B30;
            margin-bottom: 24px;
            display: none;
        }

        /* ── Idle placeholder ── */
        #idle-placeholder {
            padding: 80px 0;
            text-align: center;
        }

        #idle-placeholder svg {
            margin: 0 auto 16px;
            opacity: .13;
        }

        #idle-placeholder p {
            font-size: 14px;
            color: var(--text-sec);
        }
    </style>
</head>

<body>
    <div class="page">

        <!-- Top bar -->
        <div class="topbar">
            <span class="wordmark">SYN Scanner</span>
            <button class="theme-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
                <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    style="display:none">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
                <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
        </div>

        <!-- Hero -->
        <div class="hero">
            <h1>Port Scanner</h1>
            <p>TCP SYN scan — fast, direct, minimal.</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="field">
                <label for="targetIp">Target IP</label>
                <input id="targetIp" type="text" value="127.0.0.1" placeholder="e.g. 192.168.1.1" spellcheck="false" />
            </div>
            <div class="field">
                <label for="portRange">Port Range</label>
                <input id="portRange" type="text" value="1-1024" placeholder="e.g. 1-65535" spellcheck="false" />
            </div>
            <button class="scan-btn" id="scanBtn">
                <div class="spinner"></div>
                <span class="btn-label">Start Scan</span>
            </button>
        </div>

        <div class="divider"></div>

        <!-- Error -->
        <div class="error-bar" id="errorBar"></div>

        <!-- Idle placeholder -->
        <div id="idle-placeholder">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" />
                <circle cx="24" cy="24" r="12" stroke="currentColor" stroke-width="2" />
                <circle cx="24" cy="24" r="4" fill="currentColor" />
            </svg>
            <p>Configure a target and start scanning.</p>
        </div>

        <!-- Results -->
        <div id="resultsSection" style="display:none">
            <div class="results-meta">
                <h2 id="resultsTitle">Open Ports</h2>
                <span class="meta-badge" id="metaBadge">—</span>
            </div>

            <div class="results-layout">
                <!-- Table -->
                <div class="table-wrap">
                    <table class="port-table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Port</th>
                                <th>Service</th>
                            </tr>
                        </thead>
                        <tbody id="portTableBody"></tbody>
                    </table>
                </div>

                <!-- Chart -->
                <div class="chart-panel">
                    <span class="chart-title">Distribution</span>
                    <div class="donut-wrap">
                        <canvas id="donutChart"></canvas>
                        <div class="donut-center">
                            <span class="donut-big" id="donutBig">—</span>
                            <span class="donut-sub">open</span>
                        </div>
                    </div>
                    <div class="chart-legend">
                        <div class="legend-row">
                            <span class="legend-label">
                                <span class="legend-dot" style="background:var(--text-pri)"></span>Open
                            </span>
                            <span class="legend-val" id="legendOpen">—</span>
                        </div>
                        <div class="legend-row">
                            <span class="legend-label">
                                <span class="legend-dot" style="background:var(--border)"></span>Closed / Filtered
                            </span>
                            <span class="legend-val" id="legendClosed">—</span>
                        </div>
                        <div class="legend-row"
                            style="margin-top:4px;padding-top:12px;border-top:1px solid var(--border)">
                            <span class="legend-label" style="color:var(--text-pri);font-weight:500">Total</span>
                            <span class="legend-val" id="legendTotal">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ── Theme ──────────────────────────────────────────────────
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        const iconSun = document.getElementById('iconSun');
        const iconMoon = document.getElementById('iconMoon');
        let donutChart = null;
        let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function applyTheme() {
            html.classList.toggle('dark', dark);
            iconSun.style.display = dark ? 'block' : 'none';
            iconMoon.style.display = dark ? 'none' : 'block';
            if (donutChart) updateChartColors();
        }
        themeBtn.addEventListener('click', () => { dark = !dark; applyTheme(); });
        applyTheme();

        // ── Chart ──────────────────────────────────────────────────
        function getCSSVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function buildChart(open, closed) {
            const ctx = document.getElementById('donutChart').getContext('2d');
            const colOpen = getCSSVar('--text-pri');
            const colClosed = getCSSVar('--border');

            if (donutChart) { donutChart.destroy(); donutChart = null; }

            donutChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [open, closed],
                        backgroundColor: [colOpen, colClosed],
                        borderWidth: 0,
                        hoverOffset: 0
                    }]
                },
                options: {
                    cutout: '88%',
                    animation: { animateRotate: true, duration: 600 },
                    plugins: { tooltip: { enabled: false }, legend: { display: false } },
                    events: []
                }
            });
        }

        function updateChartColors() {
            if (!donutChart) return;
            donutChart.data.datasets[0].backgroundColor = [
                getCSSVar('--text-pri'),
                getCSSVar('--border')
            ];
            donutChart.update('none');
        }

        // ── Scan ───────────────────────────────────────────────────
        const scanBtn = document.getElementById('scanBtn');
        const errorBar = document.getElementById('errorBar');
        const idleHolder = document.getElementById('idle-placeholder');
        const resultsSection = document.getElementById('resultsSection');
        const portTableBody = document.getElementById('portTableBody');
        const metaBadge = document.getElementById('metaBadge');
        const resultsTitle = document.getElementById('resultsTitle');
        const donutBig = document.getElementById('donutBig');
        const legendOpen = document.getElementById('legendOpen');
        const legendClosed = document.getElementById('legendClosed');
        const legendTotal = document.getElementById('legendTotal');

        function setLoading(on) {
            scanBtn.disabled = on;
            scanBtn.classList.toggle('loading', on);
        }

        function showError(msg) {
            errorBar.textContent = msg;
            errorBar.style.display = 'block';
        }
        function clearError() { errorBar.style.display = 'none'; }

        function renderResults(data) {
            idleHolder.style.display = 'none';
            resultsSection.style.display = 'block';

            const open = data.open_ports || [];
            const closed = data.closed_filtered ?? 0;
            const total = data.total_scanned ?? (open.length + closed);

            // meta
            metaBadge.textContent = `${data.target} · ${total} ports`;
            resultsTitle.textContent = open.length === 1
                ? '1 Open Port'
                : `${open.length} Open Port${open.length === 0 ? 's' : 's'}`;

            // table
            portTableBody.innerHTML = '';
            if (open.length === 0) {
                portTableBody.innerHTML = `
        <tr><td colspan="3">
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
              <line x1="14" y1="14" x2="26" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="26" y1="14" x2="14" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p>No open ports found in the scanned range.</p>
          </div>
        </td></tr>`;
            } else {
                open.forEach(({ port, service }) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
          <td><span class="open-dot"></span></td>
          <td><span class="port-num">${port}</span></td>
          <td><span class="service-tag">${service || 'unknown'}</span></td>`;
                    portTableBody.appendChild(tr);
                });
            }

            // chart
            donutBig.textContent = open.length;
            legendOpen.textContent = open.length.toLocaleString();
            legendClosed.textContent = closed.toLocaleString();
            legendTotal.textContent = total.toLocaleString();
            buildChart(Math.max(open.length, 0.0001), closed); // avoid empty donut
        }

        scanBtn.addEventListener('click', async () => {
            clearError();
            const target = document.getElementById('targetIp').value.trim();
            const portRange = document.getElementById('portRange').value.trim();
            if (!target || !portRange) { showError('Please fill in both Target IP and Port Range.'); return; }

            setLoading(true);
            resultsSection.style.display = 'none';

            try {
                const res = await fetch('http://localhost:8000/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_ip: target, port_range: portRange, threads: 50 })
                });
                if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
                const data = await res.json();
                renderResults(data);
            } catch (err) {
                idleHolder.style.display = 'block';
                showError(`Scan failed: ${err.message}`);
            } finally {
                setLoading(false);
            }
        });

        // ── Demo mode: inject mock data for UI preview ──────────────
        // Remove this block in production.
        (function injectDemo() {
            if (window.location.search.includes('demo')) {
                setTimeout(() => renderResults({
                    target: '127.0.0.1',
                    total_scanned: 1024,
                    open_ports: [
                        { port: 22, service: 'ssh' },
                        { port: 80, service: 'http' },
                        { port: 443, service: 'https' },
                        { port: 3306, service: 'mysql' },
                        { port: 6379, service: 'redis' },
                    ],
                    closed_filtered: 1019
                }), 0);
            }
        })();
    </script>
</body>

</html>
